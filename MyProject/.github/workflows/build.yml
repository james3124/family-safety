name: Flutter CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        working-directory: family_safety_tracker
        run: flutter pub get

      - name: Analyze
        working-directory: family_safety_tracker
        run: flutter analyze

      - name: Run tests
        working-directory: family_safety_tracker
        run: flutter test
